server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML 是版本入口，禁止存储，确保发布后获取最新资源引用。
  # history 路由回退到 /index.html 后，也会匹配此规则。
  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Vite 默认生成 assets/name-HASH.ext，只对带哈希的资源长期缓存。
  # 不存在的资源返回 404，不回退为 HTML；404 不携带长期缓存头。
  location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 非哈希资源可以存储，但每次使用前需要向服务器验证。
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }
}

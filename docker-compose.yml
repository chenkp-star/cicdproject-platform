# services：定义要启动的容器服务
services:

  # 定义一个名为 jenkins 的服务
  jenkins:

    # 指定 Docker 构建 Jenkins 镜像时使用的 dockerfile 文件（镜像构建说明书）
    # Docker 会默认去寻找：
    # ./jenkins/Dockerfile
    build: ./jenkins


    # 指定构建完成后的 Docker 镜像名称
    #
    # cicdproject-jenkins：镜像名称
    # local：镜像版本/tag
    #
    # 最终可以通过：
    # docker images
    #
    # 看到类似：
    #
    # cicdproject-jenkins    local
    image: cicdproject-jenkins:local


    # 指定 Jenkins 容器内部使用 root 用户运行
    user: root


    # ports：把宿主机端口映射到 Jenkins 容器端口
    ports:

      # 宿主机 8081 端口
      #        ↓
      # Jenkins 容器内部 8080 端口
      #
      # 因此启动之后浏览器访问：http://localhost:8081

      # 就可以打开 Jenkins。
      - "8081:8080"


      # Jenkins Agent 通信端口
      #
      # Jenkins 可以采用 Controller + Agent 架构：
      #
      # Jenkins Controller
      #       ↓
      # Jenkins Agent
      #
      # Agent 可以部署在其他服务器，
      # 专门负责执行构建任务。
      #
      # 你目前本地学习阶段基本用不到，
      # 但可以先保留。
      - "50000:50000"


    # volumes：挂载数据或宿主机资源到 Jenkins 容器
    volumes:

      # Jenkins 数据持久化
      #
      # Jenkins 的大量数据默认存在：
      #
      # /var/jenkins_home（因为 jenkins 运行在 docker 容器中，容器给 jenkins提供一个隔离外界的 linux 环境，这里的路径是 linux 环境的路径）
      #
      # 例如 /var/jenkins_home 存放了以下数据：
      #
      # Jenkins 用户
      # Jenkins 插件
      # Job
      # Pipeline
      # Credentials
      # 构建记录
      # Jenkins 系统配置
      #
      # 如果不挂载 volume：
      #
      # Jenkins Container
      #        ↓
      # 删除容器
      #        ↓
      # Jenkins 配置可能全部丢失（这些数据都存在 /var/jenkins_home 中，这个文件就在 jenkins 的 docker 容器中）
      #
      # 这里使用 Docker Volume ，写法是： jenkins_home:/var/jenkins_home：
      #
      # jenkins_home 是 docker volume 的名称，表示定义一个 docker volume， /var/jenkins_home 的数据会被实际写入 jenkins_home
      # 这样即使 Jenkins 容器删除再重新创建，仍然可以在 jenkins_home 中找到这些数据
      - jenkins_home:/var/jenkins_home


      # 把宿主机的 Docker 控制接口挂载给 Jenkins 容器，让 Jenkins 能直接执行 Docker 命令、构建和启动其他容器。
      - /var/run/docker.sock:/var/run/docker.sock


# 顶层 volumes
#
# 这里声明 Docker Compose 使用的 Docker Volume
#
# 上面写了：
#
# - jenkins_home:/var/jenkins_home
#
# 所以这里要定义：
#
# jenkins_home
#
# Docker 会自动创建并管理这个 Volume。
volumes:

  # Jenkins 持久化数据卷
  #
  # 可以通过：
  #
  # docker volume ls
  #
  # 查看。
  #
  # 删除 Jenkins 容器不会自动删除这个 Volume。
  #
  # 因此 Jenkins 数据可以长期保留。
  jenkins_home: